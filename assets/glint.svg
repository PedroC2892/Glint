<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242c42"/>
      <stop offset="50%" stop-color="#181f32"/>
      <stop offset="100%" stop-color="#0e1320"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c8ba1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2d3748" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  
  <!-- Subtle Inner Glass Sheen -->
  <rect x="32" y="32" width="448" height="224" rx="104" ry="104" fill="url(#sheen)"/>
  
  <!-- Border Rim -->
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Magnifier Handle -->
  <line x1="298" y1="298" x2="394" y2="394" stroke="url(#handleGrad)" stroke-width="42" stroke-linecap="round"/>
  <line x1="302" y1="302" x2="390" y2="390" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Magnifier Lens Shadow -->
  <circle cx="226" cy="226" r="112" fill="none" stroke="#000000" stroke-width="36" opacity="0.35"/>

  <!-- Magnifier Lens Ring -->
  <circle cx="224" cy="224" r="108" fill="url(#lensGlass)" stroke="url(#lensRing)" stroke-width="32"/>

  <!-- Glass Crescent Reflection -->
  <path d="M 160 160 A 88 88 0 0 1 288 160 A 84 84 0 0 0 168 200 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Glint / Sparkle Star Glow -->
  <circle cx="360" cy="116" r="64" fill="url(#glintGlow)"/>

  <!-- Glint Star 4-Point Shape -->
  <path d="M 360 84 Q 360 116 392 116 Q 360 116 360 148 Q 360 116 328 116 Q 360 116 360 84 Z" fill="url(#glintGrad)"/>
  <circle cx="360" cy="116" r="5" fill="#ffffff"/>

  <!-- Secondary Accent Star -->
  <path d="M 124 336 Q 124 348 136 348 Q 124 348 124 360 Q 124 348 112 348 Q 124 348 124 336 Z" fill="#ffffff" opacity="0.85"/>
</svg>
