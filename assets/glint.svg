<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1f26"/>
      <stop offset="60%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </linearGradient>

    <!-- Squircle border highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555866" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#23252e" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Top sheen on app tile -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Stand Pedestal Gradients -->
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c3f4a"/>
      <stop offset="50%" stop-color="#23252d"/>
      <stop offset="100%" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="standRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d505e"/>
      <stop offset="50%" stop-color="#84889c"/>
      <stop offset="100%" stop-color="#4d505e"/>
    </linearGradient>

    <!-- Crystal Ball Sphere Radial Gradient -->
    <radialGradient id="ballShading" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#73778a"/>
      <stop offset="25%" stop-color="#484b57"/>
      <stop offset="65%" stop-color="#252730"/>
      <stop offset="90%" stop-color="#17181e"/>
      <stop offset="100%" stop-color="#0e0f13"/>
    </radialGradient>

    <!-- Rim Light / Fresnel on Sphere Edge -->
    <radialGradient id="ballRim" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="94%" stop-color="#9ea4bc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d0d5ea" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Upper Specular Reflection (Glass Crescent) -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glint Sparkle Aura -->
    <radialGradient id="glintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#dbe4ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#8ba2d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8ba2d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Glass Sheen -->
  <rect x="32" y="32" width="448" height="224" rx="104" ry="104" fill="url(#sheen)"/>

  <!-- Border Rim -->
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Pedestal / Stand Base Shadow -->
  <ellipse cx="256" cy="386" rx="124" ry="24" fill="#090a0d" opacity="0.8"/>

  <!-- Pedestal Tier 1 -->
  <ellipse cx="256" cy="380" rx="116" ry="20" fill="url(#standGrad)" stroke="url(#standRim)" stroke-width="2"/>
  <!-- Pedestal Tier 2 -->
  <ellipse cx="256" cy="368" rx="96" ry="16" fill="url(#standGrad)" stroke="url(#standRim)" stroke-width="1.8"/>

  <!-- Crystal Ball Main Sphere -->
  <circle cx="256" cy="236" r="144" fill="url(#ballShading)"/>

  <!-- Rim / Glass Fresnel Border -->
  <circle cx="256" cy="236" r="144" fill="url(#ballRim)"/>

  <!-- Glass Top Crescent Reflection -->
  <path d="M 166 164 C 204 126 308 126 346 164 C 314 148 200 148 166 164 Z" fill="url(#glassReflection)"/>

  <!-- Internal subtle dark nebula / mist inside crystal ball -->
  <ellipse cx="270" cy="260" rx="80" ry="50" fill="#2d303d" opacity="0.4" transform="rotate(-15 270 260)"/>

  <!-- Primary Crystal Glint / Star Sparkle -->
  <circle cx="220" cy="188" r="54" fill="url(#glintGlow)"/>
  <!-- Main 4-point Diamond Star -->
  <path d="M 220 136 Q 220 188 272 188 Q 220 188 220 240 Q 220 188 168 188 Q 220 188 220 136 Z" fill="#ffffff"/>
  <circle cx="220" cy="188" r="4.5" fill="#ffffff"/>

  <!-- Secondary Smaller Sparkle -->
  <circle cx="334" cy="276" r="30" fill="url(#glintGlow)" opacity="0.8"/>
  <path d="M 334 250 Q 334 276 360 276 Q 334 276 334 302 Q 334 276 308 276 Q 334 276 334 250 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="334" cy="276" r="2.5" fill="#ffffff"/>
</svg>